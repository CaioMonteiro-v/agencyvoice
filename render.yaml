# Blueprint Render — AgencyVoice (ElevenLabs cloud)
# https://dashboard.render.com/select-repo?type=blueprint

services:
  - type: web
    name: agencyvoice
    runtime: node
    plan: free
    region: oregon
    branch: cursor/agencyvoice-clonagem-voz-7a78
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:web
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VOICE_PROVIDER
        value: elevenlabs
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
